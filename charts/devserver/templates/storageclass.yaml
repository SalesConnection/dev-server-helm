{{- if and .Values.persistence.enabled (eq .Values.persistence.type "efs") .Values.persistence.efs.createStorageClass }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.persistence.efs.storageClassName }}
  labels:
    {{- include "devserver.labels" . | nindent 4 }}
provisioner: efs.csi.aws.com
parameters:
  provisioningMode: efs-ap
  fileSystemId: {{ required "persistence.efs.fileSystemId is required when persistence.type=efs" .Values.persistence.efs.fileSystemId | quote }}
  directoryPerms: {{ .Values.persistence.efs.directoryPerms | quote }}
  basePath: {{ .Values.persistence.efs.basePath | quote }}
  subPathPattern: {{ .Values.persistence.efs.subPathPattern | quote }}
  ensureUniqueDirectory: {{ .Values.persistence.efs.ensureUniqueDirectory | quote }}
reclaimPolicy: {{ .Values.persistence.efs.reclaimPolicy }}
volumeBindingMode: {{ .Values.persistence.efs.volumeBindingMode }}
{{- end }}
{{- if and .Values.persistence.enabled .Values.persistence.ebs.createStorageClass }}
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.persistence.ebs.storageClassName }}
  labels:
    {{- include "devserver.labels" . | nindent 4 }}
provisioner: ebs.csi.aws.com
parameters:
  type: {{ .Values.persistence.ebs.type | default "gp3" | quote }}
  fsType: {{ .Values.persistence.ebs.fsType | default "ext4" | quote }}
  encrypted: {{ .Values.persistence.ebs.encrypted | default "true" | quote }}
reclaimPolicy: {{ .Values.persistence.ebs.reclaimPolicy | default "Retain" }}
volumeBindingMode: {{ .Values.persistence.ebs.volumeBindingMode | default "WaitForFirstConsumer" }}
allowVolumeExpansion: {{ .Values.persistence.ebs.allowVolumeExpansion | default true }}
{{- end }}
